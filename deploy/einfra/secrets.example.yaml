# Tajné hodnoty. Tenhle soubor do gitu nepatří — zkopíruj si ho mimo repozitář,
# nebo si secrets vytvoř rovnou přes `kubectl create secret` (níže).
#
#   kubectl -n rpraxe create secret generic rpraxe-secrets \
#       --from-literal=ucitel-heslo='Nasadit-heslo'
#   kubectl -n rpraxe create secret generic rpraxe-ai \
#       --from-literal=key='sk-…'
#
# Namespace `rpraxe` musí existovat (k8s.yaml), jinak to tu není k ničemu.
# Heslo účtu se uplatní jen při prvním startu (než existuje state/users.json).
# Klíč k modelu jde zadat i bez restartu ze správny (Správa → Modely); tenhle
# secret je výhoda hlavně proto, že se nedostane do zálohy jako config.json.
apiVersion: v1
kind: Secret
metadata:
  name: rpraxe-secrets
  namespace: rpraxe
type: Opaque
stringData:
  ucitel-heslo: NASADIT-HESLO
---
apiVersion: v1
kind: Secret
metadata:
  name: rpraxe-ai
  namespace: rpraxe
type: Opaque
stringData:
  key: NASADIT-KLIC
