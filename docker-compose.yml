name: rpraxe

# JEDEN kontejner: aplikace + sandbox R uvnitř (RPRAXE_RUNNER_PROMIT=1).
# Tohle je varianta, která běží i v Kubernetes (CESNET/e-INFRA) — tam je jeden
# kontejner na pod nejjednodušší. Pokud chceš tvrdší izolaci R (úplný absence
# sítě), použij docker-compose.dva-slouzby.yml.
#
# Pozor na práva: kontejner běží pod UID 4242, takže `state/` a `datasets/`
# na hostiteli musí patřit tomu UID. Viz docs/hosting.md („migrace“).

services:
  rpraxe:
    image: rpraxe:${RPRAXE_IMAGE_TAG:-latest}
    env_file: [rpraxe.env]
    environment:
      RPRAXE_RUNNER_PROMIT: "1"
      RPRAXE_SERVE: app
    volumes:
      - ./state:/data/state
      # data jsou pro zápis (učitel nahraje CSV); sandbox si z nich jen čte
      - ./datasets:/data/datasets
    ports:
      # přes .env: doma 172.20.0.1 (brána je macvlan), jinak stačí 127.0.0.1
      - "${RPRAXE_BIND:-127.0.0.1}:${RPRAXE_PORT:-8710}:8080"
    tmpfs:
      # běžiště R: mizí s kontejnerem, na disk se nic nedostane
      - /work:size=512m,mode=1777,uid=4242,gid=4242
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2600m
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
